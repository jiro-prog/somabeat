[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "integrated-system"
version = "0.1.0"
description = "Bio-inspired integrated AI architecture"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "hdbscan>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
integrated-system = "orchestrator.main:main"

[tool.setuptools.packages.find]
include = [
    "shared_state*",
    "llamarcute_live*",
    "bridge*",
    "orchestrator*",
    "sensory*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
